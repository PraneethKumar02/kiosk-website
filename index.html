<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, orientation=portrait" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>BEML Kiosk</title>

  <style>
    /* Optional inline styling — move to styles.css if preferred */

    .text a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px; /* space between logo and text */
      text-decoration: none;
      background-color: #ffffff; /* white button */
      color: #000000; /* black text */
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 2px solid #ffffff; /* subtle white border */
      transition: all 0.3s ease;
    }

    .text a:hover {
      background-color: #f0f0f0; /* light gray on hover */
      border-color: #f0f0f0;
      transform: scale(1.03);
    }

    .text a img {
      height: 22px; /* adjust as needed */
      width: auto;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <section class="showcase">
    <header>
      <img class="logo" src="./assets/logo.png" alt="BEML logo" />
    </header>

    <video src="./assets/landingVideo.mp4" muted loop autoplay></video>
    <div class="overlay"></div>

    <div class="text">
      <div class="text-bg"></div> <!-- polygon background -->
      <h2>BEML LIMITED</h2>
      <h3>Beyond Possibilities</h3>

      <!-- White Explore button with BEML logo -->
      <a href="./verticals_template/verticals.html">
        <img src="./assets/infinix.png" alt="BEML logo" />
        Explore
      </a>
    </div>

    <!-- Social Media Icons -->
    <ul class="social">
      <li>
        <a href="https://www.facebook.com/BEMLHQ" target="_blank">
          <img src="./assets/facebook.svg" alt="Facebook" />
          <span>@BEMLHQ</span>
        </a>
      </li>
      <li>
        <a href="https://www.instagram.com/bemlltd" target="_blank">
          <img src="./assets/instagram.svg" alt="Instagram" />
          <span>@bemlltd</span>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/company/beml-ltd." target="_blank">
          <img src="./assets/linkedin.svg" alt="LinkedIn" />
          <span>BEML Ltd.</span>
        </a>
      </li>
      <li>
        <a href="https://x.com/bemlltd" target="_blank">
          <img src="./assets/twitter-x.svg" alt="Twitter" />
          <span>@BEMLltd</span>
        </a>
      </li>
      <li>
        <a href="https://www.youtube.com/channel/UCnOlihn7zpZ948okFrtqrbQ" target="_blank">
          <img src="./assets/youtube.svg" alt="YouTube" />
          <span>@BEMLLimited</span>
        </a>
      </li>
    </ul>
  </section>
</body>
</html>
