<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBU Engine</title>
  <link rel="stylesheet" href="../css/verticals-new.css" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <a href="index.html" class="back-button">Back</a>
    <img src="../assets/logo.png" alt="BEML Logo" class="beml-logo" />
  </header>

  <!-- ======= CARD SECTION ======= -->
  <section class="card-container">

    <!-- CARD 1 -->
    <div class="card">
      <img src="../assets/defence.jpg" alt="Defence">
      <div class="card-content">
        <a href="" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">1500HP Engine for Main Battle Tanks</h1>
        </a>
      </div>
    </div>


  </section>

</body>
</html>
