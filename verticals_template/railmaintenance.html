<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBU Commuter Rail - Rail Maintenance Equipment</title>
  <link rel="stylesheet" href="../css/verticals-new.css" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <a href="index.html" class="back-button">Back</a>
    <img src="../assets/logo.png" alt="BEML Logo" class="beml-logo" />
  </header>

  <!-- ======= CARD SECTION ======= -->
  <section class="card-container">

    <!-- CARD 1 -->
     <div class="card">
      <a href="../rail_template/detc.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">
        <img src="../assets/ir.png" alt="Defence"
             alt="Defence" 
             style="width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease;"
             onmouseover="this.style.transform='scale(1.05)';" 
             onmouseout="this.style.transform='scale(1)';">
      </a>
      
      <div class="card-content">
        <a href="../rail_template/detc.html" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">8W Diesel Electric Tower Car</h1>
        </a>
      </div>
    </div>
    

    <!-- CARD 2 -->
    <div class="card">
      <a href="../rail_template/cmv.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">

        <a href="../rail_template/cmv.html" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">Catenary Maintenance Vehicle</h1>
        </a>
      </div>
    </div>
  

    <!-- CARD 3 -->
      <div class="card">
      <a href="../rail_template/ohe.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">
        <img src="../assets/ir.png" alt="Defence"
             alt="Defence" 
             style="width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease;"
             onmouseover="this.style.transform='scale(1.05)';" 
             onmouseout="this.style.transform='scale(1)';">

      <div class="card-content">
        <a href="../rail_template/ohe.html"

           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">8 Wheeler OHE Car</h1>
        </a>
      </div>
    </div>
