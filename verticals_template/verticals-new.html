<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEML Verticals</title>
  <link rel="stylesheet" href="../css/verticals-new.css" />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <a href="../index.html" class="back-button">Back</a>
    <img src="../assets/logoBlack.png" alt="BEML Logo" class="beml-logo" />
  </header>

  <!-- ======= CARD SECTION ======= -->
  <section class="card-container">

    <!-- CARD 1 -->
    <div class="card">
      <img src="../assets/defence.jpg" alt="Defence">
      <div class="card-content">
        <h1>DEFENCE & AEROSPACE</h1>
        <div class="button-group">
          <a href="./armoured.html">Armoured Vehicles</a>
          <a href="./hmv.html">High Mobility Vehicles</a>
          <a href="./aerospace.html">Aerospace Equipment</a>
          <a href="./maritime.html">Maritime Equipment</a>
          <a href="../defence_template/datran.html">Engine</a>
        </div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="card">
      <img src="../assets/mining.jpg" alt="Mining">
      <div class="card-content">
        <h1>MINING & CONSTRUCTION</h1>
        <div class="button-group">
           <a href="./mining-new.html"
            style="display:inline-block; text-align:center; background:#E5BE01; color:#23282B; text-decoration:none; padding:10px 14px; border-radius:25px; font-size:0.9rem; box-shadow:0 3px 10px rgba(0,0,0,0.2); transition:all 0.3s ease;">
            Mining Equipment
          </a>
           <a href="./construction.html"
            style="display:inline-block; text-align:center; background:#E5BE01; color:#23282B; text-decoration:none; padding:10px 14px; border-radius:25px; font-size:0.9rem; box-shadow:0 3px 10px rgba(0,0,0,0.2); transition:all 0.3s ease;">
            Construction Equipment
          </a>
           <a href="./hp.html"
            style="display:inline-block; text-align:center; background:#E5BE01; color:#23282B; text-decoration:none; padding:10px 14px; border-radius:25px; font-size:0.9rem; box-shadow:0 3px 10px rgba(0,0,0,0.2); transition:all 0.3s ease;">
            Hydraulics and Powerline
          </a>
        </div>
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="card">
      <img src="../assets/rail.jpg" alt="Rail">
      <div class="card-content">
        <h1>RAIL & METRO</h1>
        <div class="button-group">
          <a href="./commuter.html"
            style="display:inline-block; text-align:center; background:#063971; color:#fff; text-decoration:none; padding:10px 14px; border-radius:25px; font-size:0.9rem; box-shadow:0 3px 10px rgba(0,0,0,0.2); transition:all 0.3s ease;">
            Commuter Rail
          </a>
          <a href="./metro.html"
            style="display:inline-block; text-align:center; background:#063971; color:#fff; text-decoration:none; padding:10px 14px; border-radius:25px; font-size:0.9rem; box-shadow:0 3px 10px rgba(0,0,0,0.2); transition:all 0.3s ease;">
           Metro Rail
          </a>
        </div>
      </div>
    </div>

  </section>
  <script>
  // Save scroll position before navigating away
  document.querySelectorAll(".button-group a").forEach(link => {
    link.addEventListener("click", () => {
      sessionStorage.setItem("scrollPosition", window.scrollY);
    });
  });

  // Restore scroll position when coming back
  window.addEventListener("load", () => {
    const scrollPos = sessionStorage.getItem("scrollPosition");
    if (scrollPos) {
      window.scrollTo({ top: parseFloat(scrollPos), behavior: "instant" });
      sessionStorage.removeItem("scrollPosition");
    }
  });
</script>

</body>
</html>
