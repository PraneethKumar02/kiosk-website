<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBU Maritime</title>
  <link rel="stylesheet" href="../css/verticals-new.css" />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <a href="./verticals-new.html" class="back-button">Back</a>
    <img src="../assets/logoBlack.png" alt="BEML Logo" class="beml-logo" />
  </header>

  <!-- ======= CARD SECTION ======= -->
  <section class="card-container">

    <!-- CARD 2 -->
    <div class="card">
      <img src="../assets/maritime_assets/CD.png" alt="Mining">
      <div class="card-content">
        <h1>DREDGING/DE-SILTING SOLUTIONS</h1>
        <div class="button-group">
          <a href="../aerospace_template/ctadredger.html">Crawler Type Amphibious Dredger</a>
          <a href="../aerospace_template/ltadredger.html">Leaping Type Amphibious Dredger</a>
          <a href="../aerospace_template/cabledredger.html">Cable Dredger</a>
          <a href="../aerospace_template/longreach.html">Long Reach Excavator</a>
          <a href="../aerospace_template/amphibian.html">Amphibian Excavator</a>
        </div>
      </div>
    </div>

  </section>
  <script>
  // Save scroll position before navigating away
  document.querySelectorAll(".button-group a").forEach(link => {
    link.addEventListener("click", () => {
      sessionStorage.setItem("scrollPosition", window.scrollY);
    });
  });

  // Restore scroll position when coming back
  window.addEventListener("load", () => {
    const scrollPos = sessionStorage.getItem("scrollPosition");
    if (scrollPos) {
      window.scrollTo({ top: parseFloat(scrollPos), behavior: "instant" });
      sessionStorage.removeItem("scrollPosition");
    }
  });
</script>

</body>
</html>
