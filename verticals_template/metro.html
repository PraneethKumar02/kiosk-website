<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBU Metro Rail</title>
  <link rel="stylesheet" href="../css/verticals-new.css" />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <a href="../verticals_template/verticals-new.html" class="back-button">Back</a>
    <img src="../assets/logoBlack.png" alt="BEML Logo" class="beml-logo" />
  </header>

  <!-- ======= CARD SECTION ======= -->
  <section class="card-container">

    <!-- CARD 1 -->
    <div class="card">
       <a href="../rail_template/mumbai.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">
        <img src="../assets/Mumbai_Metro.png" alt="Defence"
             alt="Defence" 
             style="width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease;"
             onmouseover="this.style.transform='scale(1.05)';" 
             onmouseout="this.style.transform='scale(1)';">
      </a>
      <div class="card-content">
        <a href="../rail_template/mumbai.html" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">MUMBAI METRO</h1>
        </a>
      </div>
    </div>
    
    <div class="card">
      <a href="../rail_template/bmrcl.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">
        <img src="../assets/Blg_Metro.png" alt="Defence"
             alt="Defence" 
             style="width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease;"
             onmouseover="this.style.transform='scale(1.05)';" 
             onmouseout="this.style.transform='scale(1)';">
      </a>
      
      <div class="card-content">
        <a href="../rail_template/bmrcl.html" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">BENGALURU METRO</h1>
        </a>
      </div>
    </div>

    <div class="card">
       <a href="../rail_template/dmrc.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">
        <img src="../assets/Delhi_metro.png" alt="Defence"
             alt="Defence" 
             style="width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease;"
             onmouseover="this.style.transform='scale(1.05)';" 
             onmouseout="this.style.transform='scale(1)';">
      </a>
      <div class="card-content">
        <a href="../rail_template/dmrc.html" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">DELHI METRO</h1>
        </a>
      </div>
    </div>
    <div class="card">
      <a href="../rail_template/kolkata.html" 
         style="display:inline-block; width:350px; height:100%; text-decoration:none; cursor:pointer; overflow:hidden;">
        <img src="../assets/Kolkata_metro.png" alt="Defence"
             alt="Defence" 
             style="width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease;"
             onmouseover="this.style.transform='scale(1.05)';" 
             onmouseout="this.style.transform='scale(1)';">
      </a>
      <div class="card-content">
        <a href="../rail_template/kolkata.html" 
           style="text-decoration: none; color: inherit; cursor: pointer;"
           onmouseover="this.querySelector('h1').style.color='#007bff';"
           onmouseout="this.querySelector('h1').style.color='inherit';">
          <h1 style="transition: color 0.3s ease;">KOLKATA METRO</h1>
        </a>
      </div>
    </div>
    
  </section>
  <script>
  // Save scroll position before navigating away
  document.querySelectorAll(".button-group a").forEach(link => {
    link.addEventListener("click", () => {
      sessionStorage.setItem("scrollPosition", window.scrollY);
    });
  });

  // Restore scroll position when coming back
  window.addEventListener("load", () => {
    const scrollPos = sessionStorage.getItem("scrollPosition");
    if (scrollPos) {
      window.scrollTo({ top: parseFloat(scrollPos), behavior: "instant" });
      sessionStorage.removeItem("scrollPosition");
    }
  });
</script>
</body>
</html>
