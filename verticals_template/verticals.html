
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  <title>BEML Verticals</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700,800,900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --overlay-color: #31385c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* Back to Home button */
    .back-home {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #fff;
      color: #111;
      padding: 10px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: 0.2s;
      z-index: 10;
    }

    .back-home:hover {
      letter-spacing: 5px;
    }

    /* Logo */
    header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    header img {
      width: 180px;
      height: auto;
      object-fit: contain;
    }

    /* Main container */
    .verticals-container {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100dvh;
    }

    .vertical-section {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
      transition: 0.4s ease;
      border-right: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 50px;
    }

    .vertical-section:last-child {
      border-right: none;
    }

    /* Background image */
    .vertical-section img.bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: transform 0.5s ease, filter 0.5s ease;
      z-index: 0; /* behind everything */
    }

    .vertical-section:hover img.bg-img {
      transform: scale(1.05);
      filter: brightness(85%);
    }

    /* Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay-color);
      mix-blend-mode: overlay;
      z-index: 1; /* above bg image but below text/button */
    }

    /* Vertical text */
    .vertical-text {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 20px;
    }

    .vertical-text h2 {
      font-size: 2.8em;
      font-weight: 800;
      line-height: 1.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.6);
    }

    /* Explore button inside vertical section */
    .explore-btn {
      position: relative; /* ensure it stays above bg & overlay */
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background-color: #ffffff;
      color: #111;
      padding: 10px 30px;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      border: 2px solid #ffffff;
      margin-bottom: 30px;
      transition: all 0.3s ease; /* smooth hover effect */
    }

    .explore-btn img {
      height: 22px;
      width: auto;
      vertical-align: middle;
    }

    /* Hover effect for Explore button */
    .explore-btn:hover {
      background-color: #f0f0f0;
      border-color: #f0f0f0;
      transform: scale(1.05);
    }

    /* ============================= RESPONSIVE DESIGN ============================= */

    @media (max-width: 1024px) {
      .vertical-text h2 {
        font-size: 2.2em;
      }

      .back-home {
        padding: 8px 20px;
        font-size: 0.9em;
      }

      header img {
        width: 150px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }

      .verticals-container {
        flex-direction: column;
        height: 100dvh;
      }

      .vertical-section {
        height: 33.33dvh;
        border-right: none;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 20px;
      }

      .vertical-section:last-child {
        border-bottom: none;
      }

      .vertical-text h2 {
        font-size: 1.8em;
        margin-bottom: 10px;
      }

      .explore-btn {
        font-size: 0.85em;
        padding: 8px 18px;
      }

      header img {
        width: 120px;
      }

      .back-home::after {
        content: "Back";
      }

      .back-home {
        color: transparent;
        background: #fff;
        position: fixed;
      }

      .back-home::after {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #111;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    }

    @media (max-width: 480px) {
      .back-home {
        top: 10px;
        left: 10px;
        padding: 6px 15px;
      }

      header {
        top: 10px;
        right: 10px;
      }

      header img {
        width: 100px;
      }

      .vertical-text h2 {
        font-size: 1.3em;
        line-height: 1.2em;
      }

      .explore-btn {
        font-size: 0.75em;
        padding: 6px 14px;
      }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="back-home">Back to Home</a>

  <header>
    <img src="../assets/logo.png" alt="BEML logo" />
  </header>

  <div class="verticals-container">
    <!-- Defence & Aerospace -->
    <div class="vertical-section">
      <img class="bg-img" src="../assets/defence.jpg" alt="Defence & Aerospace" />
      <div class="overlay"></div>
      <div class="vertical-text">
        <h2>Defence &<br>Aerospace</h2>
      </div>
      <a href="./defence.html" class="explore-btn">
        <img src="../assets/infinix.png" alt="BEML logo" />
        EXPLORE
      </a>
    </div>

    <!-- Mining & Construction -->
    <div class="vertical-section">
      <img class="bg-img" src="../assets/mining.jpg" alt="Mining & Construction" />
      <div class="overlay"></div>
      <div class="vertical-text">
        <h2>Mining &<br>Construction</h2>
      </div>
      <a href="./mining.html" class="explore-btn">
        <img src="../assets/infinix.png" alt="BEML logo" />
        EXPLORE
      </a>
    </div>

    <!-- Rail & Metro -->
    <div class="vertical-section">
      <img class="bg-img" src="../assets/rail.jpg" alt="Rail & Metro" />
      <div class="overlay"></div>
      <div class="vertical-text">
        <h2>Rail &<br>Metro</h2>
      </div>
      <a href="./rail.html" class="explore-btn">
        <img src="../assets/infinix.png" alt="BEML logo" />
        EXPLORE
      </a>
    </div>
  </div>
</body>
</html>
