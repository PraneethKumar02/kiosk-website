<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  <title>BEML Verticals</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700,800,900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --overlay-color: #31385c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* Back to Home button */
    .back-home {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #fff;
      color: #111;
      padding: 10px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: 0.2s;
      z-index: 10;
    }

    .back-home:hover {
      letter-spacing: 5px;
    }

    /* Logo */
    header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    header img {
      width: 180px;
      height: auto;
      object-fit: contain;
    }

    /* Main container */
    .verticals-container {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100dvh; /* dynamic viewport height fixes mobile height issue */
    }

    .vertical-section {
      position: relative;
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      transition: 0.4s ease;
      border-right: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 50px;
    }

    .vertical-section:last-child {
      border-right: none;
    }

    .vertical-section img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    .vertical-section:hover img {
      transform: scale(1.05);
      filter: brightness(85%);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay-color);
      mix-blend-mode: overlay;
    }

    .vertical-text {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
    }

    .vertical-text h2 {
      font-size: 2.8em;
      font-weight: 800;
      line-height: 1.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.6);
    }

    .vertical-text a {
      display: inline-block;
      font-size: 1em;
      background: #fff;
      padding: 10px 30px;
      text-decoration: none;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: 0.2s ease;
      border-radius: 25px;
    }

    .vertical-text a:hover {
      letter-spacing: 5px;
      background: #fff;
      color: #111;
    }

    /* =============================
       RESPONSIVE DESIGN
    ============================= */

    /* Tablets */
    @media (max-width: 1024px) {
      .vertical-text h2 {
        font-size: 2.2em;
      }

      .back-home {
        padding: 8px 20px;
        font-size: 0.9em;
      }

      header img {
        width: 150px;
      }
    }

    /* Mobile */
    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }

      .verticals-container {
        flex-direction: column;
        height: 100dvh;
      }

      .vertical-section {
        height: 33.33dvh;
        border-right: none;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 25px;
      }

      .vertical-section:last-child {
        border-bottom: none;
      }

      .vertical-text h2 {
        font-size: 1.8em;
        margin-bottom: 10px;
      }

      .vertical-text a {
        font-size: 0.85em;
        padding: 8px 18px;
      }

      header img {
        width: 120px;
      }

      /* Change 'Back to Home' → 'Back' */
      .back-home::after {
        content: "Back";
      }
      .back-home {
        color: transparent;
        background: #fff;
        position: fixed;
      }
      .back-home::after {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #111;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    }

    /* Small Phones */
    @media (max-width: 480px) {
      .back-home {
        top: 10px;
        left: 10px;
        padding: 6px 15px;
      }

      header {
        top: 10px;
        right: 10px;
      }

      header img {
        width: 100px;
      }

      .vertical-text h2 {
        font-size: 1.3em;
        line-height: 1.2em;
      }

      .vertical-text a {
        font-size: 0.75em;
        padding: 6px 14px;
      }
    }
  </style>
</head>

<body>
  <a href="./index.html" class="back-home">Back to Home</a>

  <header>
    <img src="./assets/logo.png" alt="BEML logo" />
  </header>

  <div class="verticals-container">
    <div class="vertical-section">
      <img src="./assets/defence.jpg" alt="Defence & Aerospace" />
      <div class="overlay"></div>
      <div class="vertical-text">
        <h2>Defence & <br>Aerospace</h2>
        <a href="./defence.html">Explore</a>
      </div>
    </div>

    <div class="vertical-section">
      <img src="./assets/mining.jpg" alt="Mining & Construction" />
      <div class="overlay"></div>
      <div class="vertical-text">
        <h2>Mining & <br>Construction</h2>
        <a href="./mining.html">Explore</a>
      </div>
    </div>

    <div class="vertical-section">
      <img src="./assets/rail.jpg" alt="Rail & Metro" />
      <div class="overlay"></div>
      <div class="vertical-text">
        <h2>Rail & <br>Metro</h2>
        <a href="./rail.html">Explore</a>
      </div>
    </div>
  </div>
</body>
</html>
