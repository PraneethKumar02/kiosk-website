<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEML Defence and Aerospace</title>
    <style>
        /* Reset */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-height: 100vh;
        }

        /* Background */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .background-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px) brightness(70%);
            transform: scale(1.05);
        }

        .background-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        /* Logo */
        .beml-logo {
            position: fixed;
            top: 20px;
            right: 40px;
            height: 70px;
            z-index: 1;
        }

        /* Carousel */
        .crew-carousel {
            width: 100%;
            max-width: 1400px;
            height: 500px;
            position: relative;
            perspective: 1000px;
            margin-top: 120px;
            z-index: 1;
        }

        .crew-track {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .crew-card {
            position: absolute;
            width: 400px;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            transition: all 0.8s ease;
            cursor: pointer;
        }

        .crew-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
        }

        /* Card positions */
        .crew-card.center { z-index: 10; transform: scale(1.15); }
        .crew-card.left-1 { transform: translateX(-250px) scale(0.95); opacity: 0.85; filter: grayscale(80%); }
        .crew-card.left-2 { transform: translateX(-500px) scale(0.85); opacity: 0.65; filter: grayscale(100%); }
        .crew-card.right-1 { transform: translateX(250px) scale(0.95); opacity: 0.85; filter: grayscale(80%); }
        .crew-card.right-2 { transform: translateX(500px) scale(0.85); opacity: 0.65; filter: grayscale(100%); }
        .crew-card.hidden { opacity: 0; pointer-events: none; }

        /* Crew info */
        .crew-info {
            text-align: center;
            margin-top: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            z-index: 1;
        }

        .crew-name {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .crew-role {
            font-size: 1.2rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.1em;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
        }

        /* Dots */
        .crew-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .crew-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
        }

        .crew-dot.active { background: #fff; }

        /* Arrows */
        .crew-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(107,142,35,0.8);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 2;
        }

        .crew-arrow:hover { background: rgba(107,142,35,1); }
        .crew-left { left: 5px; }
        .crew-right { right: 5px; }

        /* Back button */
        #back-home {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 25px;
            font-size: 1rem;
            background: #fff;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            z-index: 1;
        }

        #back-home:hover { letter-spacing: 6px; }

        /* Tablet */
        @media screen and (max-width: 1024px) {
            .crew-carousel { height: 450px; }
            .crew-card { width: 300px; height: 400px; }
            .crew-card.left-1 { transform: translateX(-180px) scale(0.95); }
            .crew-card.left-2 { transform: translateX(-360px) scale(0.85); }
            .crew-card.right-1 { transform: translateX(180px) scale(0.95); }
            .crew-card.right-2 { transform: translateX(360px) scale(0.85); }
            .crew-name { font-size: 2rem; }
            .crew-role { font-size: 1rem; }
            .crew-arrow { width: 40px; height: 40px; font-size: 1.5rem; }
        }

        /* Mobile */
        @media screen and (max-width: 600px) {
            .crew-carousel { height: 350px; margin-top: 100px; }
            .crew-card { width: 220px; height: 300px; }
            .crew-card.left-1 { transform: translateX(-120px) scale(0.9); }
            .crew-card.left-2 { transform: translateX(-240px) scale(0.8); }
            .crew-card.right-1 { transform: translateX(120px) scale(0.9); }
            .crew-card.right-2 { transform: translateX(240px) scale(0.8); }
            .crew-name { font-size: 1.5rem; }
            .crew-role { font-size: 0.9rem; }
            .crew-arrow { width: 35px; height: 35px; font-size: 1.2rem; }
            .crew-dots { gap: 6px; }
            .beml-logo { height: 50px; right: 20px; }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background-container">
        <img src="./assets/defence.jpg" alt="Defence background">
    </div>

    <!-- Logo -->
    <img src="./assets/logo.png" alt="BEML Logo" class="beml-logo">

    <!-- Carousel -->
    <div class="crew-carousel">
        <button class="crew-arrow crew-left" aria-label="Previous slide">‹</button>
        <div class="crew-track">
            <div class="crew-card" data-index="0"><a href="./12x12.html"><img src="./assets/12x12.png" alt="BEML HMV 12x12"></a></div>
            <div class="crew-card" data-index="1"><a href="./abhinandan.html"><img src="./assets/hnx50.png" alt="BEML HNX50"></a></div>
            <div class="crew-card" data-index="2"><a href="./arrv.html"><img src="./assets/arrv.jpg" alt="BEML ARRV"></a></div>
            <div class="crew-card" data-index="3"><a href="./iso.html"><img src="./assets/iso.jpg" alt="ISO Shelter"></a></div>
            <div class="crew-card" data-index="4"><a href="./smmp.html"><img src="./assets/smmp.jpg" alt="SMMP"></a></div>
            <div class="crew-card" data-index="5"><a href="./tma.html"><img src="./assets/tma.png" alt="TMA Vehicle"></a></div>
            <div class="crew-card" data-index="6"><a href="./uav.html"><img src="./assets/uav.jpg" alt="UAV Drone"></a></div>
            <div class="crew-card" data-index="7"><a href="./ubp.html"><img src="./assets/ubp.png" alt="UBP Unit"></a></div>
        </div>
        <button class="crew-arrow crew-right" aria-label="Next slide">›</button>
    </div>

    <!-- Crew info -->
    <div class="crew-info">
        <h2 class="crew-name">BEML HMV 12x12</h2>
        <p class="crew-role"></p>
    </div>

    <!-- Dots -->
    <div class="crew-dots">
        <div class="crew-dot active" data-index="0"></div>
        <div class="crew-dot" data-index="1"></div>
        <div class="crew-dot" data-index="2"></div>
        <div class="crew-dot" data-index="3"></div>
        <div class="crew-dot" data-index="4"></div>
        <div class="crew-dot" data-index="5"></div>
        <div class="crew-dot" data-index="6"></div>
        <div class="crew-dot" data-index="7"></div>
    </div>

    <!-- Back button -->
    <button id="back-home" onclick="location.href='index.html'">Back to Home</button>

    <!-- JavaScript -->
    <script>
        const crewCards = document.querySelectorAll('.crew-card');
        const crewDots = document.querySelectorAll('.crew-dot');
        const crewName = document.querySelector('.crew-name');
        const crewRole = document.querySelector('.crew-role');
        const leftBtn = document.querySelector('.crew-left');
        const rightBtn = document.querySelector('.crew-right');

        const crewMembers = [
            { name: 'HMV 12x12'},
            { name: 'Abhinandan HNX50'},
            { name: 'Arjun ARRV'},
            { name: 'ISO Grid Panels'},
            { name: 'Sheet Metal Machine Parts'},
            { name: 'TMA Trolley for LCA AF MK2'},
            { name: 'Tactical Unmanned Aerial Vehicle'},
            { name: 'Universal Bomb Pallette'}
        ];

        let crewIndex = 0;
        let isAnimating = false;

        function updateCrewCarousel(newIndex) {
            if (isAnimating) return;
            isAnimating = true;
            crewIndex = (newIndex + crewCards.length) % crewCards.length;

            crewCards.forEach((card, i) => {
                const offset = (i - crewIndex + crewCards.length) % crewCards.length;
                card.classList.remove('center', 'left-1', 'left-2', 'right-1', 'right-2', 'hidden');
                if (offset === 0) card.classList.add('center');
                else if (offset === 1) card.classList.add('right-1');
                else if (offset === 2) card.classList.add('right-2');
                else if (offset === crewCards.length - 1) card.classList.add('left-1');
                else if (offset === crewCards.length - 2) card.classList.add('left-2');
                else card.classList.add('hidden');
            });

            crewDots.forEach((dot, i) => dot.classList.toggle('active', i === crewIndex));
            crewName.style.opacity = '0';
            crewRole.style.opacity = '0';

            setTimeout(() => {
                crewName.textContent = crewMembers[crewIndex].name;
                crewRole.textContent = crewMembers[crewIndex].role || '';
                crewName.style.opacity = '1';
                crewRole.style.opacity = '1';
            }, 300);

            setTimeout(() => { isAnimating = false; }, 800);
        }

        leftBtn.addEventListener('click', () => updateCrewCarousel(crewIndex - 1));
        rightBtn.addEventListener('click', () => updateCrewCarousel(crewIndex + 1));
        crewDots.forEach((dot, i) => dot.addEventListener('click', () => updateCrewCarousel(i)));
        crewCards.forEach((card, i) => card.addEventListener('click', () => updateCrewCarousel(i)));

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') updateCrewCarousel(crewIndex - 1);
            else if (e.key === 'ArrowRight') updateCrewCarousel(crewIndex + 1);
        });

        let touchStart = 0, touchEnd = 0;
        document.addEventListener('touchstart', e => { touchStart = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEnd = e.changedTouches[0].screenX;
            const diff = touchStart - touchEnd;
            if (Math.abs(diff) > 50) {
                if (diff > 0) updateCrewCarousel(crewIndex + 1);
                else updateCrewCarousel(crewIndex - 1);
            }
        });

        updateCrewCarousel(0);
    </script>
</body>
</html>
