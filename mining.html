<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEML Defence and Aerospace</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    background: #111;
}

/* Background */
.background-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
}
.background-container img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(8px) brightness(70%);
    transform: scale(1.05);
}

/* Logo */
.beml-logo {
    position: fixed;
    top: 15px;
    right: 15px;
    height: 60px;
    z-index: 2;
}

/* Carousel */
.crew-carousel {
    width: 100%;
    max-width: 1400px;
    height: 400px;
    position: relative;
    perspective: 1000px;
    margin-top: 100px;
    z-index: 1;
}

.crew-track {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s ease;
}

.crew-card {
    position: absolute;
    width: 300px;
    height: 400px;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    transition: all 0.8s ease;
    cursor: pointer;
}

.crew-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 15px;
}

/* Card positions */
.crew-card.center { z-index: 10; transform: scale(1.1); }
.crew-card.left-1 { transform: translateX(-180px) scale(0.9); opacity: 0.85; filter: grayscale(80%); }
.crew-card.left-2 { transform: translateX(-360px) scale(0.8); opacity: 0.65; filter: grayscale(100%); }
.crew-card.right-1 { transform: translateX(180px) scale(0.9); opacity: 0.85; filter: grayscale(80%); }
.crew-card.right-2 { transform: translateX(360px) scale(0.8); opacity: 0.65; filter: grayscale(100%); }
.crew-card.hidden { opacity: 0; pointer-events: none; }

/* Info text */
.crew-info {
    text-align: center;
    margin-top: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
    padding: 15px 25px;
    border-radius: 10px;
    display: inline-block;
}

.crew-name {
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
    font-weight: 600;
}

.crew-role {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.05em;
}

/* Dots */
.crew-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 15px;
}

.crew-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
}
.crew-dot.active { background: #fff; }

/* Arrows */
.crew-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(107,142,35,0.8);
    color: white;
    width: 35px; height: 35px;
    border-radius: 50%;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 2;
}
.crew-arrow:hover { background: rgba(107,142,35,1); }
.crew-left { left: 5px; }
.crew-right { right: 5px; }

/* Back Home button */
#back-home {
    position: fixed;
    bottom: 15px;
    right: 15px;
    padding: 8px 20px;
    font-size: 0.9rem;
    background: #fff;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.2s;
}
#back-home:hover { letter-spacing: 4px; }

/* Tablet */
@media screen and (max-width: 1024px) {
    .crew-carousel { height: 350px; margin-top: 80px; }
    .crew-card { width: 250px; height: 350px; }
    .crew-card.left-1 { transform: translateX(-140px) scale(0.9); }
    .crew-card.left-2 { transform: translateX(-280px) scale(0.8); }
    .crew-card.right-1 { transform: translateX(140px) scale(0.9); }
    .crew-card.right-2 { transform: translateX(280px) scale(0.8); }
    .crew-name { font-size: 1.5rem; }
    .crew-role { font-size: 0.85rem; }
}

/* Mobile */
@media screen and (max-width: 600px) {
    .crew-carousel { height: 300px; margin-top: 60px; }
    .crew-card { width: 200px; height: 280px; }
    .crew-card.left-1 { transform: translateX(-100px) scale(0.85); }
    .crew-card.left-2 { transform: translateX(-200px) scale(0.7); }
    .crew-card.right-1 { transform: translateX(100px) scale(0.85); }
    .crew-card.right-2 { transform: translateX(200px) scale(0.7); }
    .crew-name { font-size: 1.3rem; }
    .crew-role { font-size: 0.75rem; }
    .crew-arrow { width: 30px; height: 30px; font-size: 1rem; }
    .crew-dots { gap: 6px; }
    .beml-logo { height: 50px; top: 10px; right: 10px; }
    #back-home { padding: 6px 15px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="background-container">
    <img src="./assets/mining.jpg" alt="Defence background">
</div>

<img src="./assets/logo.png" alt="BEML Logo" class="beml-logo">

<div class="crew-carousel">
    <button class="crew-arrow crew-left">‹</button>
    <div class="crew-track">
        <div class="crew-card" data-index="0"><a href="./BH205E.html"><img src="./assets/mining.jpg" alt="BEML Dump Truck BH205E"></a></div>
        <div class="crew-card" data-index="1"><a href="./wheel loaders.html"><img src="./assets/wheel.jpg" alt="BEML Wheel Loader"></a></div>
        <div class="crew-card" data-index="2"><a href="./crawler.html"><img src="./assets/crawler.png" alt="BEML Crawler"></a></div>
        <div class="crew-card" data-index="3"><a href="./water.html"><img src="./assets/water.jpg" alt="BEML Water Sprinkler"></a></div>
        <div class="crew-card" data-index="4"><a href="./excavators.html"><img src="./assets/excavator.jpg" alt="BEML Excavator"></a></div>
    </div>
    <button class="crew-arrow crew-right">›</button>
</div>

<div class="crew-info">
    <h2 class="crew-name">BEML Dump Truck BH205E</h2>
    <p class="crew-role"></p>
</div>

<div class="crew-dots">
    <div class="crew-dot active" data-index="0"></div>
    <div class="crew-dot" data-index="1"></div>
    <div class="crew-dot" data-index="2"></div>
    <div class="crew-dot" data-index="3"></div>
    <div class="crew-dot" data-index="4"></div>
</div>

<button id="back-home" onclick="location.href='index.html'">Back to Home</button>

<script>
const crewCards = document.querySelectorAll('.crew-card');
const crewDots = document.querySelectorAll('.crew-dot');
const crewName = document.querySelector('.crew-name');
const leftBtn = document.querySelector('.crew-left');
const rightBtn = document.querySelector('.crew-right');

const crewMembers = [
    { name: 'BEML Dump Truck BH205E' },
    { name: 'BEML Wheel Loader' },
    { name: 'BEML Crawler' },
    { name: 'BEML Water Sprinkler' },
    { name: 'BEML Excavator' }
];

let crewIndex = 0;
let isAnimating = false;

function updateCrewCarousel(newIndex){
    if(isAnimating) return;
    isAnimating = true;
    crewIndex = (newIndex + crewCards.length) % crewCards.length;

    crewCards.forEach((card,i)=>{
        const offset=(i-crewIndex+crewCards.length)%crewCards.length;
        card.classList.remove('center','left-1','left-2','right-1','right-2','hidden');
        if(offset===0) card.classList.add('center');
        else if(offset===1) card.classList.add('right-1');
        else if(offset===2) card.classList.add('right-2');
        else if(offset===crewCards.length-1) card.classList.add('left-1');
        else if(offset===crewCards.length-2) card.classList.add('left-2');
        else card.classList.add('hidden');
    });

    crewDots.forEach((dot,i)=>dot.classList.toggle('active',i===crewIndex));
    crewName.style.opacity='0';
    setTimeout(()=>{
        crewName.textContent=crewMembers[crewIndex].name;
        crewName.style.opacity='1';
    },300);

    setTimeout(()=>{isAnimating=false;},800);
}

leftBtn.addEventListener('click',()=>updateCrewCarousel(crewIndex-1));
rightBtn.addEventListener('click',()=>updateCrewCarousel(crewIndex+1));
crewDots.forEach((dot,i)=>dot.addEventListener('click',()=>updateCrewCarousel(i)));
crewCards.forEach((card,i)=>card.addEventListener('click',()=>updateCrewCarousel(i)));
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') updateCrewCarousel(crewIndex-1);
    else if(e.key==='ArrowRight') updateCrewCarousel(crewIndex+1);
});
let touchStart=0,touchEnd=0;
document.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].screenX;});
document.addEventListener('touchend',e=>{
    touchEnd=e.changedTouches[0].screenX;
    const diff=touchStart-touchEnd;
    if(Math.abs(diff)>50){
        if(diff>0) updateCrewCarousel(crewIndex+1);
        else updateCrewCarousel(crewIndex-1);
    }
});
updateCrewCarousel(0);
</script>
</body>
</html>
